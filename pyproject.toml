[project]
name = "aegis-agents"
version = "0.1.1"
description = "Local-first, MCP-native multi-agent platform — job tracker + daily briefing for software engineers, with tracing, evals, and budgets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Naren Sreekanth", email = "narensreekanth@gmail.com" },
]
keywords = ["mcp", "agents", "langgraph", "anthropic", "claude", "llm", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.40",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "loguru>=0.7",
    "tenacity>=9.0",
]

[project.urls]
Homepage = "https://github.com/nareus/aegis"
Repository = "https://github.com/nareus/aegis"
Issues = "https://github.com/nareus/aegis/issues"

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "aegis/_assets/migrations"
"profile.example.yaml" = "aegis/_assets/profile.example.yaml"
"src/aegis/_assets/compose.toolmode.yml" = "aegis/_assets/compose.toolmode.yml"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres,redis]>=4.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
